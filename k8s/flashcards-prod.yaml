
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flashcards-postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flashcards-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flashcards-db
  template:
    metadata:
      labels:
        app: flashcards-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: flashcards
            - name: POSTGRES_DB
              value: flashcards
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flashcards-db
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U flashcards -d flashcards
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: 64Mi
              cpu: 25m
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: flashcards-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: flashcards-db
spec:
  selector:
    app: flashcards-db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flashcards-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flashcards-cache
  template:
    metadata:
      labels:
        app: flashcards-cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 5
          resources:
            requests:
              memory: 24Mi
              cpu: 10m
---
apiVersion: v1
kind: Service
metadata:
  name: flashcards-cache
spec:
  selector:
    app: flashcards-cache
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flashcards-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flashcards-app
  template:
    metadata:
      labels:
        app: flashcards-app
    spec:
      imagePullSecrets:
        - name: dockerhub
      initContainers:
        - name: migrate
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: flashcards-db
                  key: password
          command:
            - sh
            - -c
            - |
              set -e
              until pg_isready -h flashcards-db -U flashcards -d flashcards; do
                sleep 3
              done
              psql -v ON_ERROR_STOP=1 -h flashcards-db -U flashcards -d flashcards -f /migrations/001_schema.sql
              COUNT=$(psql -At -h flashcards-db -U flashcards -d flashcards -c "SELECT COUNT(*) FROM decks")
              if [ "$COUNT" = "0" ]; then
                psql -v ON_ERROR_STOP=1 -h flashcards-db -U flashcards -d flashcards -f /migrations/002_seed.sql
              fi
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      containers:
        - name: fastapi
          image: diyaa02/flashcards-srs:prod
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flashcards-db
                  key: database-url
            - name: REDIS_URL
              value: redis://flashcards-cache:6379/0
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: 64Mi
              cpu: 25m
      volumes:
        - name: migrations
          configMap:
            name: flashcards-migrations
---
apiVersion: v1
kind: Service
metadata:
  name: flashcards-app
spec:
  selector:
    app: flashcards-app
  ports:
    - port: 8080
      targetPort: 8080

